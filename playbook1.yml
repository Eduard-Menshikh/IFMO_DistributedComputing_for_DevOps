- name: Deploy WordPress and DB in Docker
  hosts: hosts
  become: true
  vars_files:
    - .vars.yaml
  tasks:
    - name: Check if Docker is already installed
      command: docker --version
      register: docker_check
      ignore_errors: true

    - name: Update apt package index
      apt:
        update_cache: yes
      when: docker_check.rc != 0

    - name: Install required packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present
      when: docker_check.rc != 0

    - name: Create /etc/apt/keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      when: docker_check.rc != 0

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      when: docker_check.rc != 0

    - name: Add Docker APT repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch={{ ansible_architecture }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename }} stable
      when: docker_check.rc != 0

    - name: Update apt package index again
      apt:
        update_cache: yes
      when: docker_check.rc != 0

    - name: Install Docker CE and plugins
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: docker_check.rc != 0

    - name: Ensure Docker service is running and enabled
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create Docker network for proxy
      docker_network:
        name: nginx-proxy
        state: present

    - name: Start nginx-proxy container
      docker_container:
        name: nginx-proxy
        image: jwilder/nginx-proxy
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - /var/run/docker.sock:/tmp/docker.sock:ro
          - /etc/nginx/certs:/etc/nginx/certs:ro
          - /etc/nginx/vhost.d:/etc/nginx/vhost.d
          - /usr/share/nginx/html:/usr/share/nginx/html
        networks:
          - name: nginx-proxy
        restart_policy: always
        state: started

    - name: Start Let's Encrypt companion
      docker_container:
        name: nginx-proxy-le
        image: jrcs/letsencrypt-nginx-proxy-companion
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock:ro
          - /etc/nginx/certs:/etc/nginx/certs
          - /etc/nginx/vhost.d:/etc/nginx/vhost.d
          - /usr/share/nginx/html:/usr/share/nginx/html
        networks:
          - name: nginx-proxy
        restart_policy: always
        state: started
        env:
          NGINX_PROXY_CONTAINER: nginx-proxy
          DEFAULT_EMAIL: "{{ tls_owner_email }}"

    - name: Start MySQL container
      docker_container:
        name: wp_db
        image: mysql:latest
        env:
          MYSQL_DATABASE: "{{ wordpress_db_name }}"
          MYSQL_USER: "{{ db_user }}"
          MYSQL_PASSWORD: "{{ db_pass }}"
          MYSQL_ROOT_PASSWORD: "{{ db_root_pass }}"
        networks:
          - name: nginx-proxy
        state: started
        restart_policy: always

    - name: Start WordPress container
      docker_container:
        name: wordpress
        image: wordpress:latest
        env:
          WORDPRESS_DB_HOST: wp_db:3306
          WORDPRESS_DB_NAME: "{{ wordpress_db_name }}"
          WORDPRESS_DB_USER: "{{ db_user }}"
          WORDPRESS_DB_PASSWORD: "{{ db_pass }}"
          VIRTUAL_HOST: "{{ domain_name }}"
          LETSENCRYPT_HOST: "{{ domain_name }}"
          LETSENCRYPT_EMAIL: "{{ tls_owner_email }}"
        networks:
          - name: nginx-proxy
        restart_policy: always
        state: started
